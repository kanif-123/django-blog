{% extends 'base.html' %} 

{% block content %}
<div class="container mt-4">
    <h2>Download Uploaded Excel Files</h2>
    
    <ul class="list-group">
        {% for doc in files %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ doc.file.name }} 
                <a href="{{ doc.file.url }}" download class="btn btn-sm btn-success">Download</a>
            </li>
        {% empty %}
            <li class="list-group-item">No files available.</li>
        {% endfor %}
    </ul>
    <br>
    <a href="{% url 'upload_excel' %}" class="btn btn-primary">Upload More Files</a>
</div>
{% endblock %}
